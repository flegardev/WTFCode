# PRIVATE secret file; replace placeholders off-repository. Mode 0600, readable by UID 10001.
# Mount at /etc/msmtprc in the worker. Never commit a real credential.
defaults
auth on
tls on
tls_starttls on
tls_trust_file /etc/ssl/certs/ca-certificates.crt
account pilot
host SMTP_HOST_APPROVED_BY_FOUNDER
port 587
from APPROVED_SENDER_ADDRESS
user SMTP_USER
password SMTP_SECRET_FROM_PROVIDER
account default : pilot
